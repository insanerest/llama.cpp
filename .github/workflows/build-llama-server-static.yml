name: Build llama-server

on:
  push:
    tags:
      - "v*"

# ============================================================
# macOS x86_64 (Intel, macOS 15)
# ============================================================
jobs:
  macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build llama-server (macOS x64)
        run: |
          cmake -B build \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARCH=x86-64 \
            -DLLAMA_SERVER_SSL=OFF

          cmake --build build --config Release --target llama-server

          mkdir -p dist
          cp build/bin/llama-server dist/llama-server-macos-x64
          chmod +x dist/llama-server-macos-x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*

# ============================================================
# macOS arm64 (Apple Silicon, macOS 15)
# ============================================================
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build llama-server (macOS arm64)
        run: |
          cmake -B build \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_SERVER_SSL=OFF

          cmake --build build --config Release --target llama-server

          mkdir -p dist
          cp build/bin/llama-server dist/llama-server-macos-arm64
          chmod +x dist/llama-server-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

# ============================================================
# macOS Universal (lipo)
# ============================================================
  macos-universal:
    needs: [macos-x64, macos-arm64]
    runs-on: macos-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            artifacts/macos-x64/llama-server-macos-x64 \
            artifacts/macos-arm64/llama-server-macos-arm64 \
            -output dist/llama-server-macos-universal

          chmod +x dist/llama-server-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*

# ============================================================
# Linux x64
# ============================================================
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build llama-server (Linux x64)
        run: |
          cmake -B build \
            -DBUILD_SHARED_LIBS=OFF

          cmake --build build --config Release --target llama-server

          mkdir -p dist
          cp build/bin/llama-server dist/llama-server-linux-x64
          chmod +x dist/llama-server-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*

# ============================================================
# Windows x64
# ============================================================
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (static)
        run: |
          cmake -S . -B build -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build llama-server (Windows x64)
        run: |
          cmake --build build --config Release --target llama-server

      - name: Package
        run: |
          mkdir dist
          copy build\bin\Release\llama-server.exe dist\llama-server-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

# ============================================================
# GitHub Release
# ============================================================
  release:
    needs:
      - macos-universal
      - linux-x64
      - windows-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
